---
layout: default
title: Blog
---
<h1>Blog</h1>
<ul class="posts">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a> <span class="date">{{ post.date | date: "%b %Y" }}</span>
    {% if post.description %}<div class="post-desc">{{ post.description }}</div>{% endif %}
  </li>
  {% endfor %}
</ul>
