title: Omkar Bhilare
description: PhD candidate at the University of Toronto working on CGRA architecture and reconfigurable computing.
# shown after the name in the browser tab on the home page
tagline: PhD Candidate, University of Toronto
url: https://omkarbhilare.com
baseurl: ""
lang: en

author:
  name: Omkar Bhilare
  email: omkar.bhilare@mail.utoronto.ca
  affiliation: University of Toronto
  photo: /assets/img/omkar.jpg
  orcid: 0009-0009-9957-3338
  # month and year the PhD started; sets the masthead volume and issue
  phd_start_year: 2023
  phd_start_month: 9

links:
  - name: Email
    url: mailto:omkar.bhilare@mail.utoronto.ca
  - name: CV
    url: /Omkar_Bhilare_CV.pdf
  - name: Resume
    url: /Omkar_Bhilare_RESUME.pdf
  - name: Scholar
    url: https://scholar.google.com/citations?user=pbEdS-kAAAAJ&hl=en
  - name: GitHub
    url: https://github.com/ombhilare999
  - name: LinkedIn
    url: https://www.linkedin.com/in/omkar-bhilare-985aa2180
  - name: ORCID
    url: https://orcid.org/0009-0009-9957-3338

# number of news items shown on the home page before "show all"
news_limit: 5

permalink: /blog/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

collections:
  news:
    output: true
    permalink: /news/:path/
  projects:
    output: false

defaults:
  # link-preview card image for social sites (jekyll-seo-tag)
  - scope: { path: "" }
    values: { image: /assets/img/og-preview.jpg }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: news }
    values: { layout: post }

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-seo-tag

twitter:
  card: summary_large_image

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
