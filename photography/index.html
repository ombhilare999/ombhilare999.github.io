<dialog class="lightbox" aria-label="Photo viewer">

  </figure>

</dialog>

<script>
  (function () {
    var chips = document.querySelectorAll(".chip");
    var sections = document.querySelectorAll(".photo-section");

    chips.forEach(function (chip) {
      chip.addEventListener("click", function () {
        var f = chip.dataset.filter;
        chips.forEach(function (c) { c.classList.toggle("is-active", c === chip); });
        sections.forEach(function (s) { s.hidden = f !== "all" && s.dataset.type !== f; });
      });
    });

    var box = document.querySelector(".lightbox");
    var img = box.querySelector("img");
    var title = box.querySelector(".photo-title");
    var place = box.querySelector(".photo-place");
    var current = [], index = 0;

    function show(i) {
      index = (i + current.length) % current.length;
      var a = current[index];
      img.src = a.href;
      img.alt = a.querySelector("img").alt;
      title.textContent = a.dataset.title;
      place.innerHTML = a.dataset.place;
    }

    document.querySelectorAll(".photo-item a").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        // navigate only among photos in the visible sections
        current = Array.prototype.filter.call(
          document.querySelectorAll(".photo-item a"),
          function (x) { return !x.closest(".photo-section").hidden; }
        );
        show(current.indexOf(a));
        box.showModal();
      });
    });

    box.querySelector(".lb-close").addEventListener("click", function () { box.close(); });
    box.querySelector(".lb-prev").addEventListener("click", function () { show(index - 1); });
    box.querySelector(".lb-next").addEventListener("click", function () { show(index + 1); });
    box.addEventListener("click", function (e) { if (e.target === box) box.close(); });
    box.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") show(index - 1);
      if (e.key === "ArrowRight") show(index + 1);
    });
  })();
</script>

  <script>
    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var dark = root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    });
