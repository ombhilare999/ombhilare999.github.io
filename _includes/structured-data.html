{% comment %} schema.org data for search engines: the profile and its papers. {% endcomment %}
{% assign profiles = "" | split: "" %}{% for link in site.links %}{% if link.url contains "https://" %}{% assign profiles = profiles | push: link.url %}{% endif %}{% endfor %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ProfilePage",
      "url": {{ site.url | append: "/" | jsonify }},
      "mainEntity": { "@id": {{ site.url | append: "/#person" | jsonify }} }
    },
    {
      "@type": "Person",
      "@id": {{ site.url | append: "/#person" | jsonify }},
      "name": {{ site.author.name | jsonify }},
      "url": {{ site.url | append: "/" | jsonify }},
      "image": {{ site.url | append: site.author.photo | jsonify }},
      "email": {{ site.author.email | prepend: "mailto:" | jsonify }},
      "jobTitle": "PhD Candidate",
      "affiliation": { "@type": "CollegeOrUniversity", "name": {{ site.author.affiliation | jsonify }} },
      "knowsAbout": ["Coarse-Grained Reconfigurable Arrays", "Reconfigurable Computing", "Computer Architecture", "CAD Algorithms", "RTL Design and Verification"],
      "sameAs": {{ profiles | jsonify }}
    }{% for p in site.data.publications %},
    {
      "@type": "ScholarlyArticle",
      "headline": {{ p.title | jsonify }},
      "author": [{% assign names = p.authors | split: ", " %}{% for n in names %}{ "@type": "Person", "name": {{ n | jsonify }} }{% unless forloop.last %}, {% endunless %}{% endfor %}],
      "datePublished": {{ p.year | append: "" | jsonify }},
      "isPartOf": {{ p.venue | jsonify }},
      "url": {{ p.links[0].url | jsonify }}
    }{% endfor %}
  ]
}
</script>
