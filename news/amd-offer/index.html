  <script>
    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var dark = root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    });

    // Two-page spread, like a PDF viewer: sheets sit side by side and the
    // whole spread is scaled to fit the window.
    (function () {
      var btn = document.querySelector(".spread-toggle");
      if (!btn) return;
      var root = document.documentElement;
      var main = document.querySelector("main");
      function fit() {
        var spreadWidth = 2 * 900 + 120; // two sheets plus the paper edges and cover
        main.style.setProperty("--spread-zoom", Math.min(1, (window.innerWidth - 48) / spreadWidth));
      }
      function apply(on) {
        if (on) root.dataset.view = "spread"; else delete root.dataset.view;
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.title = on ? "Single-page view" : "Two-page view";
        fit();
      }
      apply(root.dataset.view === "spread");
      btn.addEventListener("click", function () {
        var on = root.dataset.view !== "spread";
        apply(on);
        try { localStorage.setItem("view", on ? "spread" : "single"); } catch (e) {}
      });
      window.addEventListener("resize", fit);
    })();
  </script>
